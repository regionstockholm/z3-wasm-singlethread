name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: nothing by default; each job asks for what it needs.
permissions: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.x"

      - name: Tools
        run: |
          command -v ninja || { sudo apt-get update -q && sudo apt-get install -y -q ninja-build; }
          cmake --version | head -1
          ninja --version

      - name: Fetch and verify pinned sources (Z3 tag -> commit, emsdk tag -> commit)
        run: scripts/fetch-sources.sh

      - name: Build single-threaded Z3 WASM
        run: scripts/build.sh

      - name: Smoke test (Node)
        run: node test/smoke.mjs dist

      - name: Smoke test (Deno)
        run: deno run --allow-read test/smoke.mjs dist

      - name: Summary
        run: |
          {
            echo '### Build'
            echo '```'
            cat dist/BUILDINFO
            echo
            ls -l dist
            echo
            cat dist/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: z3-wasm-singlethread
          path: dist/
          if-no-files-found: error
          retention-days: 30

  attest:
    # Provenance only for builds of this repository's own refs (not pull requests).
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: z3-wasm-singlethread
          path: dist

      - name: Verify checksums
        run: cd dist && sha256sum -c SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/z3-built.wasm
            dist/z3-built.mjs
            dist/index.mjs
            dist/worker.mjs
            dist/browser.mjs
            dist/SHA256SUMS
